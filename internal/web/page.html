<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenUsage</title>
<style>
  :root { --bg:#0d0d0d; --panel:#161616; --border:#2a2a2a; --text:#ececec; --muted:#9e9e9e; --bar:#ececec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding: 24px 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 1.35rem; font-weight: 600; }
  .sub { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; min-height: 160px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 12px; }
  .win { margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  .row b { color: var(--text); }
  .bar { height: 8px; background: #1e1e1e; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--bar); }
  .note { color: var(--muted); font-size: .82rem; line-height: 1.4; }
  .err { color: #c9c9c9; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>openusage</h1>
    <p class="sub" id="when">loading…</p>
  </header>
  <div class="grid" id="grid"></div>
</div>
<script>
function pctLeft(m) {
  if (m.remaining_pct != null) return m.remaining_pct;
  return null;
}
function card(c) {
  const wins = c.metrics || [];
  let body = "";
  if (c.message && !wins.length) body = `<p class="note ${c.status !== "OK" ? "err" : ""}">${c.message}</p>`;
  else {
    body = wins.map(m => {
      const rem = pctLeft(m);
      const label = rem == null ? "—" : Math.round(rem) + "% left";
      const w = rem == null ? 0 : Math.max(0, Math.min(100, rem));
      return `<div class="win"><div class="row"><span>${m.label}</span><b>${label}</b></div><div class="bar"><i style="width:${w}%"></i></div></div>`;
    }).join("");
    if (c.message) body += `<p class="note">${c.message}</p>`;
  }
  return `<article class="card"><h2>${c.name}</h2>${body}</article>`;
}
async function load() {
  const r = await fetch("/api/usage", { cache: "no-store" });
  const data = await r.json();
  document.getElementById("when").textContent = data.fetched_at
    ? "updated " + new Date(data.fetched_at).toLocaleString()
    : "no data";
  const cards = data.cards || [];
  document.getElementById("grid").innerHTML = cards.length
    ? cards.map(card).join("")
    : `<article class="card"><h2>No accounts</h2><p class="note">Run openusage detect, then refresh.</p></article>`;
}
load().catch(e => {
  document.getElementById("grid").innerHTML = `<article class="card"><h2>Error</h2><p class="note">${e}</p></article>`;
});
setInterval(load, 30000);
</script>
</body>
</html>
